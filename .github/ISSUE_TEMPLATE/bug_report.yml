name: Bug report
description: 回報可重現的 ChipJTAG Pro Trial 問題
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        請勿上傳 BSDL、LPF、XDC、QSF、netlist、schematic、cable serial、授權資料、客戶 waveform 或其他機密。
  - type: input
    id: version
    attributes:
      label: ChipJTAG Pro version
      placeholder: v0.2.5
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: input
    id: adapter
    attributes:
      label: Adapter and vendor tool
      placeholder: USB-Blaster II / Quartus Programmer 24.1
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect...
        2. Import...
        3. Start Scan...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result and sanitized error text
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public data check
      options:
        - label: 我已移除公司、客戶、板卡、signal、serial、授權及本機帳號等機密資訊。
          required: true
